[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aiworkpay-agent"
version = "0.1.0"
description = "Multi-agent orchestrator with human-in-the-loop delegation via AIWorkPay"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiworkpay_agent*"]
